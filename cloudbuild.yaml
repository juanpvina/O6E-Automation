# Cloud Build configuration to build Docker image and deploy to Cloud Run
steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/opencode2o-backend:$SHORT_SHA', '.']

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/opencode2o-backend:$SHORT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy opencode2o-backend \
          --image gcr.io/$PROJECT_ID/opencode2o-backend:$SHORT_SHA \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --port 8080 \
          ${_ENV_VARS}
substitutions:
  # Optional: add env var substitutions here, e.g.
  # _ENV_VARS="--set-env-vars=DB_URL=$DB_URL,API_KEY=$API_KEY"
images:
  - 'gcr.io/$PROJECT_ID/opencode2o-backend:$SHORT_SHA'
